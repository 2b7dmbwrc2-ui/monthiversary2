<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Mothiversary 💕</title>
<style id="css">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff5f7;--card:#ffffff;--text:#4a2733;--muted:#9a6b79;--accent:#e0457b;--accent2:#ff8fb1;--line:#f6d3de}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1015;--card:#2a1820;--text:#fbe6ee;--muted:#c79aab;--accent:#ff6b9d;--accent2:#b8326a;--line:#40242f}}
:root[data-theme="dark"]{--bg:#1c1015;--card:#2a1820;--text:#fbe6ee;--muted:#c79aab;--accent:#ff6b9d;--accent2:#b8326a;--line:#40242f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 48px;position:relative;z-index:2}
h1{font-size:2rem;text-align:center;margin:8px 0 4px;color:var(--accent)}
.sub{text-align:center;color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(224,69,123,.12)}
label{display:block;font:600 .85rem system-ui,sans-serif;margin:14px 0 6px;color:var(--muted)}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:1rem system-ui,sans-serif}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:600 1rem system-ui,sans-serif;border:0;border-radius:999px;padding:14px 22px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:100%;margin-top:20px}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:12px}
.hidden{display:none}
.viewer #again,.viewer #save,.viewer #make{display:none}
.big{font-size:4.5rem;text-align:center;line-height:1;margin:6px 0;color:var(--accent);font-weight:bold}
.big small{display:block;font-size:1rem;color:var(--muted);font-weight:normal;margin-top:6px}
video{width:100%;border-radius:16px;margin:16px 0;background:#000;max-height:60vh}
.note{background:var(--bg);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;margin:10px 0;line-height:1.55;font-size:1.05rem;white-space:pre-wrap;opacity:0;transform:translateY(12px);transition:.7s}
.note.show{opacity:1;transform:none}
.sig{text-align:right;color:var(--accent);font-style:italic;margin-top:14px;font-size:1.1rem}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:18px 0}.photos:empty{display:none}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border:6px solid #fff;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.18);transform:rotate(var(--r)) scale(.9);opacity:0;transition:.7s}.photos img.show{opacity:1;transform:rotate(var(--r))}
.gift{text-align:center;margin:26px 0 10px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.gift .box{font-size:5.5rem;display:inline-block;animation:bob 1.6s ease-in-out infinite}.gift p{color:var(--accent);margin:4px 0 0;font-style:italic}.gift.open .box{animation:pop .9s forwards}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}@keyframes pop{30%{transform:scale(1.35) rotate(10deg)}100%{transform:scale(0);opacity:0}}
.heart{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{display:none}.note{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Happy Mothiversary 💕</h1>
  <p class="sub" id="sub">Another month of us, wrapped in love.</p>

  <div class="card" id="make">
    <div class="row">
      <div><label for="to">For</label><input id="to" placeholder="Their name"></div>
      <div><label for="from">From</label><input id="from" placeholder="Your name"></div>
    </div>
    <label for="mo">Which month are you celebrating?</label>
    <input id="mo" type="number" min="1" value="1">
    <label for="notes">Notes of love (one per line)</label>
    <textarea id="notes" placeholder="You make ordinary days feel special.&#10;I love how you laugh at my silly jokes.&#10;Here's to many more months with you."></textarea>
    <label for="pics">Add some photos 📸 (up to 12)</label>
    <input id="pics" type="file" accept="image/*" multiple>
    <label for="vid">Attach a video 🎬 (hidden inside a gift)</label>
    <input id="vid" type="file" accept="video/*">
    <button id="go">Create the wish ✨</button>
  </div>

  <div class="card hidden" id="wish">
    <div class="big" id="num"></div>
    <p class="sub" id="head" style="margin-top:10px"></p>
    <div id="photos" class="photos"></div>
    <div id="list"></div>
    <div id="giftbox" class="gift hidden" role="button" tabindex="0" aria-label="Open your gift" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"><div class="box">🎁</div><p>One more thing… tap to open your gift</p></div>
    <video id="player" controls playsinline class="hidden"></video>
    <div class="sig" id="sig"></div>
    <button id="save" class="hidden">Save to share 💌</button>
    <p class="sub" id="st" style="margin:10px 0 0;font-size:.9rem"></p>
    <button id="again" class="ghost">Edit wish</button>
  </div>
</div>

<script id="app">
const $=id=>document.getElementById(id);
const BODY=document.querySelector('.wrap').outerHTML;
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function hearts(count){
  const set=['💗','💕','💖','💘','🌸'];
  for(let i=0;i<count;i++){
    const h=document.createElement('div');h.className='heart';
    h.textContent=set[Math.floor(Math.random()*set.length)];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(16+Math.random()*26)+'px';
    h.style.animationDuration=(4+Math.random()*5)+'s';
    h.style.animationDelay=(Math.random()*2.5)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),11000);
  }
}
let urls=[],cur={},dl=null;
function show(d){
  $('num').innerHTML=ord(d.n)+'<small>Mothiversary</small>';
  $('head').textContent=d.to?('Happy mothiversary, '+d.to+'! 💞'):'Happy mothiversary, my love! 💞';
  const list=$('list');list.innerHTML='';
  (d.lines.length?d.lines:['Every month with you is my favorite month.']).forEach(t=>{
    const e=document.createElement('div');e.className='note';e.textContent=t;list.appendChild(e);
  });
  const p=$('player'),g=$('giftbox'),ph=$('photos');ph.innerHTML='';
  d.photos.forEach((u,i)=>{const im=document.createElement('img');im.src=u;im.alt='Our photo';im.style.setProperty('--r',((i%2?1:-1)*(1+i%3))+'deg');ph.appendChild(im);setTimeout(()=>im.classList.add('show'),300+i*250)});
  p.pause();p.classList.add('hidden');p.removeAttribute('src');
  g.classList.add('hidden');g.classList.remove('open');
  if(d.video)p.src=d.video;
  $('sig').textContent=d.from?('Forever yours, '+d.from+' ♥'):'Forever yours ♥';
  $('st').textContent='';
  $('make').classList.add('hidden');$('wish').classList.remove('hidden');
  window.scrollTo(0,0);hearts(28);
  [...list.children].forEach((el,i)=>setTimeout(()=>el.classList.add('show'),700+i*900));
  if(d.video)setTimeout(()=>g.classList.remove('hidden'),700+list.children.length*900);
}
$('go').onclick=()=>{
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  const mk=f=>{const u=URL.createObjectURL(f);urls.push(u);return u};
  const f=$('vid').files[0];
  cur={to:$('to').value.trim(),from:$('from').value.trim(),n:Math.max(1,parseInt($('mo').value)||1),lines:$('notes').value.split('\n').map(s=>s.trim()).filter(Boolean)};
  show({...cur,photos:[...$('pics').files].slice(0,12).map(mk),video:f?mk(f):null});
};
$('again').onclick=()=>{
  $('player').pause();
  $('wish').classList.add('hidden');$('make').classList.remove('hidden');
};
$('num').onclick=()=>hearts(20);
$('giftbox').addEventListener('click',()=>{
  const g=$('giftbox');if(g.classList.contains('open'))return;
  g.classList.add('open');hearts(30);
  setTimeout(()=>{g.classList.add('hidden');const p=$('player');p.classList.remove('hidden');p.scrollIntoView({behavior:'smooth',block:'center'});p.play().catch(()=>{})},900);
});
const rd=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function shrink(f){
  try{
    const b=await createImageBitmap(f),s=Math.min(1,1200/Math.max(b.width,b.height));
    const c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);
    c.getContext('2d').drawImage(b,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',.82);
  }catch(e){return rd(f)}
}
$('save').onclick=async()=>{
  const st=$('st'),btn=$('save'),v=$('vid').files[0];
  if(v&&v.size>100*1024*1024){st.textContent='That video is over 100 MB. Please pick a shorter or smaller one so the file can be shared.';return}
  btn.disabled=true;st.textContent='Packing your photos, video and notes together…';
  try{
    const data={...cur,photos:await Promise.all([...$('pics').files].slice(0,12).map(shrink)),video:v?await rd(v):null};
    const json=JSON.stringify(data).replace(/</g,'\\u003c');
    const html=new Blob(['<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Happy Mothiversary 💕</title><style>',$('css').textContent,'</style></head><body class="viewer">',BODY,'<script id="wd" type="application/json">',json,'<\/script><script id="app">',$('app').textContent,'<\/script></body></html>'],{type:'text/html'});
    await dl.save({filename:'mothiversary-for-'+((cur.to||'you').replace(/[^\w-]+/g,'-'))+'.html',data:html});
    st.textContent='Saved! Send that one file (WhatsApp, email, Drive). Everything is inside it. 💌';
  }catch(e){st.textContent=(e&&e.code==='declined')?'No problem. Tap save whenever you’re ready.':'Couldn’t save the file. Try again, or use fewer or smaller photos.'}
  btn.disabled=false;
};
const wd=JSON.parse(($('wd')||{}).textContent||'null');
if(wd){document.body.classList.add('viewer');show(wd)}
else{dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}};$('save').classList.remove('hidden')}
</script>
</body>
</html>
